version: 2

sources:
  - name: olist_raw
    description: Raw tables loaded from the Olist e-commerce and marketing funnel datasets.
    schema: raw
    tables:
      - name: customers
        description: >-
          Customer IDs and location fields for the customer record attached to each order.
      - name: orders
        description: >-
          Orders with their customer ID, status, and purchase, approval, shipping, and
          delivery timestamps.
      - name: order_items
        description: >-
          Items in each order, including product, seller, price, freight, and shipping
          deadline.
      - name: order_payments
        description: >-
          Payments for each order, including payment number, method, installments, and amount.
      - name: order_reviews
        description: >-
          Customer reviews for orders, including score, optional comments, and request and
          answer dates.
      - name: products
        description: >-
          Products with category, text lengths, photo count, weight, and dimensions.
      - name: sellers
        description: Sellers with postal code, city, and state.
      - name: product_category_name_translation
        description: Portuguese product category names with their English translations.
      - name: geolocation
        description: >-
          Latitude, longitude, city, and state observations for postal code prefixes.
      - name: marketing_qualified_leads
        description: >-
          Seller leads with their first contact date, landing page, and acquisition channel.
      - name: closed_deals
        description: >-
          Seller leads that became closed deals, including sales assignments and reported
          business attributes.
