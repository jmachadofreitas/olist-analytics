version: 2

models:
  - name: stg_customers
    description: >-
      Keeps the source columns unchanged. Grain: one customer record per customer_id.
    columns:
      - name: customer_id
        description: Customer ID used on an order.
        data_tests:
          - not_null
          - unique
      - name: customer_unique_id
        description: Customer ID shared across orders.

  - name: stg_orders
    description: >-
      Renames the order timestamps and casts them from text to timestamps. Grain: one order
      per order_id.
    columns:
      - name: order_id
        description: Order ID.
        data_tests:
          - not_null
          - unique
      - name: customer_id
        description: Customer ID used on the order.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_customers')
                field: customer_id
      - name: order_status
        description: Order status.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - approved
                  - canceled
                  - created
                  - delivered
                  - invoiced
                  - processing
                  - shipped
                  - unavailable

  - name: stg_order_items
    description: >-
      Renames shipping_limit_date to shipping_limit_at, casts order_item_id to integer, casts
      the shipping deadline to timestamp, and casts price and freight to decimal. Grain: one
      row per order_id and order_item_id pair.
    columns:
      - name: order_id
        description: Order ID.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_orders')
                field: order_id
      - name: order_item_id
        description: Item number within the order.
        data_tests:
          - not_null
      - name: price
        description: Item price.
      - name: freight_value
        description: Freight charge for the item.

  - name: stg_order_payments
    description: >-
      Casts payment_sequential and payment_installments to integer and payment_value to
      decimal. Grain: one row per order_id and payment_sequential pair.
    columns:
      - name: order_id
        description: Order ID.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_orders')
                field: order_id
      - name: payment_sequential
        description: Payment number within the order.
        data_tests:
          - not_null
      - name: payment_type
        description: Payment method.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - boleto
                  - credit_card
                  - debit_card
                  - not_defined
                  - voucher
      - name: payment_installments
        description: Number of installments.
        data_tests:
          - not_null
      - name: payment_value
        description: Payment amount.
        data_tests:
          - not_null

  - name: stg_order_reviews
    description: >-
      Renames review_creation_date to review_request_date and casts it to date. Renames
      review_answer_timestamp to review_answered_at and casts it to timestamp. Casts
      review_score to integer. Grain: one row per review_id and order_id pair.
    columns:
      - name: review_id
        description: Review ID.
        data_tests:
          - not_null
      - name: order_id
        description: Order ID.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_orders')
                field: order_id
      - name: review_score
        description: Score from 1 (lowest) to 5 (highest).
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - 1
                  - 2
                  - 3
                  - 4
                  - 5
      - name: review_comment_title
        description: Review title.
      - name: review_comment_message
        description: Review comment.
      - name: review_request_date
        description: Date Olist requested the customer review.
        data_tests:
          - not_null
      - name: review_answered_at
        description: Date and time the customer submitted the review.
        data_tests:
          - not_null
