version: 2

models:
  - name: stg_customers
    description: >-
      Keeps the source columns unchanged. Grain: one customer record per customer_id.
    columns:
      - name: customer_id
        description: Customer ID used on an order.
        data_tests:
          - not_null
          - unique
      - name: customer_unique_id
        description: Customer ID shared across orders.

  - name: stg_orders
    description: >-
      Renames the order timestamps and casts them from text to timestamps. Grain: one order
      per order_id.
    columns:
      - name: order_id
        description: Order ID.
        data_tests:
          - not_null
          - unique
      - name: customer_id
        description: Customer ID used on the order.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_customers')
                field: customer_id
      - name: order_status
        description: Order status.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - approved
                  - canceled
                  - created
                  - delivered
                  - invoiced
                  - processing
                  - shipped
                  - unavailable

  - name: stg_order_items
    description: >-
      Renames shipping_limit_date to shipping_limit_at, casts order_item_id to integer, casts
      the shipping deadline to timestamp, and casts price and freight to decimal. Grain: one
      row per order_id and order_item_id pair.
    columns:
      - name: order_id
        description: Order ID.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_orders')
                field: order_id
      - name: order_item_id
        description: Item number within the order.
        data_tests:
          - not_null
      - name: price
        description: Item price.
      - name: freight_value
        description: Freight charge for the item.
