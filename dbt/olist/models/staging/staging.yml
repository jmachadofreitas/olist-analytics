version: 2

models:
  - name: stg_customers
    description: >-
      Keeps the source columns unchanged. Grain: one customer record per customer_id.
    columns:
      - name: customer_id
        description: Customer ID used on an order.
        data_tests:
          - not_null
          - unique
      - name: customer_unique_id
        description: Customer ID shared across orders.

  - name: stg_orders
    description: >-
      Renames the order timestamps and casts them from text to timestamps. Grain: one order
      per order_id.
    columns:
      - name: order_id
        description: Order ID.
        data_tests:
          - not_null
          - unique
      - name: customer_id
        description: Customer ID used on the order.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_customers')
                field: customer_id
      - name: order_status
        description: Order status.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - approved
                  - canceled
                  - created
                  - delivered
                  - invoiced
                  - processing
                  - shipped
                  - unavailable
