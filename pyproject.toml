[project]
name = "olist-analytics"
version = "0.1.0"
description = "Analytics platform using DuckDB, dbt, and Dagster."
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "dbt-duckdb>=1.10.1",
    "duckdb>=1.5.4",
    "kaggle>=2.2.3",
    "typer>=0.26.8",
]

[dependency-groups]
dev = [
    "basedpyright>=1.39.10",
    "ipykernel>=7.3.0",
    "pytest>=8.4.2",
    "ruff>=0.15.21",
    "sqlfluff>=4.3.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/common", "src/olist", "src/orchestration"]

[tool.pytest.ini_options]
pythonpath = [".", "src"]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.sqlfluff.core]
dialect = "duckdb"
max_line_length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["common", "olist", "orchestration"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
[tool.basedpyright]
include = [
    "src",
    "tests",
]
exclude = [
    "**/.venv",
    "notebooks"
]
venvPath = "."
venv = ".venv"
extraPaths = [".", "src"]
typeCheckingMode = "standard"
