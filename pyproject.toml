[project]
name = "olist-analytics"
version = "0.1.0"
description = "Analytics platform using DuckDB, dbt, and Dagster."
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "duckdb",
    "kaggle>=2.2.3",
]

[dependency-groups]
dev = ["ipykernel", "pytest", "ruff"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/olist"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.sqlfluff.core]
dialect = "duckdb"
max_line_length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
